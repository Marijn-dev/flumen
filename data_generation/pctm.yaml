dynamics:
  name: ParameterisedCellTransmissionModel
  args:
    n: &n 200
    dx: 0.01
    parameter_generator:
      name: Product
      args:
        # sigma
        - name: Uniform
          args:
            low: 0.0
            high: 1.0

        # q
        - name: Uniform
          args:
            low: 0.20
            high: 0.30

sequence_generator:
  name: UniformSqWave
  args:
    period: 1
    min: 0.
    max: 1.0

initial_state_generator:
  name: GreenshieldsInitialState
  args:
    n_cells: *n
    n_sections: 8

control_delta: 1.0
